<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夢女偷看夢角內褲模擬器 💕 秘密房間窺探計畫</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts 繁體中文圓體與襯線字體增添浪漫氛圍 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
    <!-- 引入 FontAwesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 Canvas Confetti 慶祝愛心噴發特效 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        serif: ['"Noto Serif TC"', 'serif'],
                    },
                    colors: {
                        cream: '#FFFDF9',
                        blush: '#FFF0F5',
                        roseSoft: '#FFE4EC',
                        roseMain: '#F43F5E',
                        wineDark: '#4C0519',
                        wineMid: '#881337',
                        lavenderSoft: '#F5F3FF',
                    },
                    animation: {
                        'heartbeat': 'heartbeat 1.5s ease-in-out infinite',
                        'float': 'float 3s ease-in-out infinite',
                        'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
                        'glow-pulse': 'glowPulse 2s infinite',
                    },
                    keyframes: {
                        heartbeat: {
                            '0%, 100%': { transform: 'scale(1)' },
                            '14%': { transform: 'scale(1.12)' },
                            '28%': { transform: 'scale(1)' },
                            '42%': { transform: 'scale(1.12)' },
                            '70%': { transform: 'scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-6px)' },
                        },
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-2px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(4px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-6px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(6px, 0, 0)' }
                        },
                        glowPulse: {
                            '0%, 100%': { boxShadow: '0 0 15px rgba(244, 63, 94, 0.4), 0 0 30px rgba(217, 70, 239, 0.2)' },
                            '50%': { boxShadow: '0 0 25px rgba(244, 63, 94, 0.8), 0 0 45px rgba(217, 70, 239, 0.5)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* 自訂浪漫背景紋理與蕾絲邊框細節 */
        body {
            background-color: #FFF5F7;
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 228, 230, 0.8) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(243, 232, 255, 0.8) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(254, 205, 211, 0.6) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(255, 241, 242, 0.9) 0px, transparent 50%);
            background-attachment: fixed;
            color: #4C0519;
        }

        /* 蕾絲虛線裝飾邊框 */
        .lace-border {
            border: 2px dashed rgba(244, 63, 94, 0.35);
        }

        /* 門縫動畫與光影 */
        .door-overlay {
            perspective: 1200px;
        }
        .door-panel {
            transform-origin: left center;
            transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .door-peek .door-panel {
            transform: rotateY(-28deg);
        }
        .door-slam .door-panel {
            transform: rotateY(-105deg);
        }

        /* 卡片進場動畫 */
        @keyframes cardReveal {
            0% { opacity: 0; transform: translateY(18px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-card-reveal {
            animation: cardReveal 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 稀有度流光漸層 */
        .ssr-card-bg {
            background: linear-gradient(135deg, #FFFDF9 0%, #FFF0F5 45%, #F5F3FF 100%);
            border: 2px solid #F43F5E;
        }
        .sr-card-bg {
            background: linear-gradient(135deg, #FFFDF9 0%, #FFF1F2 100%);
            border: 2px solid #FB7185;
        }
        .r-card-bg {
            background: #FFFDF9;
            border: 1.5px solid #FECDD3;
        }

        /* 隱藏滾動條但保持可滾動 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 228, 230, 0.4);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(244, 63, 94, 0.35);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(244, 63, 94, 0.6);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4 sm:px-6 lg:px-8 selection:bg-rose-200 selection:text-wineDark">

    <!-- 主容器 -->
    <main class="relative z-10 w-full max-w-2xl space-y-6">

        <!-- 頂部標題與浪漫裝飾區 -->
        <header class="text-center space-y-2 pt-2">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/80 backdrop-blur-sm border border-rose-200 shadow-sm text-xs font-bold tracking-widest text-rose-600 uppercase">
                <i class="fa-solid fa-key animate-pulse"></i>
                <span>SECRET ROOM PEEKING SIMULATOR</span>
                <i class="fa-solid fa-heart text-rose-500 animate-heartbeat"></i>
            </div>
            
            <h1 class="font-serif text-3xl sm:text-4xl font-black tracking-tight text-wineDark drop-shadow-sm">
                夢女偷看夢角內褲模擬器

            <p class="text-sm sm:text-base text-wineMid/80 max-w-md mx-auto leading-relaxed">
                門縫裡透出曖昧的微光，心跳聲在耳邊無限放大……<br class="hidden sm:inline">今天門後的「他」，會讓你看見什麼樣的秘密風景呢？
            </p>
        </header>

        <!-- 輸入設定卡片 -->
        <section class="bg-white/90 backdrop-blur-md rounded-3xl p-5 sm:p-6 shadow-xl shadow-rose-900/5 border border-rose-100">

        </section>

        <!-- 門扉過場動畫與結果展示區 -->
        <section id="stageSection" class="relative min-h-[260px] flex flex-col justify-center">

                        <i class="fa-solid fa-heart text-4xl text-rose-500"></i>
                        <p id="doorActionText" class="font-serif font-bold text-wineDark text-lg tracking-widest">心跳加速中……</p>
                    </div>
                </div>
                <!-- 房門門板 -->
                <div id="doorPanel" class="door-panel absolute inset-0 bg-gradient-to-br from-[#5C1A2B] via-[#450D1C] to-[#2B0510] border-r-4 border-amber-300/60 flex items-center justify-end pr-8 shadow-2xl">

                    <div class="absolute inset-4 border border-amber-200/20 rounded-xl pointer-events-none"></div>
                    <!-- 金色門把 -->
                    <div class="w-4 h-12 rounded-full bg-gradient-to-b from-amber-200 via-amber-400 to-amber-600 shadow-lg flex items-center justify-center">

            <!-- 抽卡結果顯示卡片 -->

                    <div class="text-center py-6 text-xs text-rose-300 italic">

        </section>

        <footer class="text-center text-xs text-wineMid/50 pb-6">
            純屬夢女向趣味娛樂模擬器・祝各位太太都能與夢角甜甜貼貼 💕

    </main>

        <div class="bg-wineDark text-white px-5 py-3 rounded-full shadow-2xl flex items-center gap-2.5 text-sm font-bold border border-rose-400/30">
            <i class="fa-solid fa-circle-check text-rose-400"></i>
            <span id="toastMessage">已複製小劇場文案到剪貼簿！</span>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 豐富繁體中文詞庫定義

        function triggerAction(actionType) {
            if (isAnimating) return;
            isAnimating = true;

            // 取得並保存名字
            const rawUser = document.getElementById("userNameInput").value.trim();
            const rawChar = document.getElementById("charNameInput").value.trim();
            const userName = rawUser || "你";
            const charName = rawChar || "他";

            try {
                localStorage.setItem("dream_peek_user", rawUser);
                localStorage.setItem("dream_peek_char", rawChar);
            } catch (e) {}

            // 切換顯示過場開門動畫
            const idleState = document.getElementById("idleState");
            const resultCard = document.getElementById("resultCard");
            const doorBox = document.getElementById("doorAnimationBox");
            const doorActionText = document.getElementById("doorActionText");

            idleState.classList.add("hidden");
            resultCard.classList.add("hidden");
            doorBox.classList.remove("hidden", "door-peek", "door-slam", "animate-shake");

            // 強制重繪以觸發 CSS 過渡
            void doorBox.offsetWidth;

            if (actionType === "peek") {
                doorActionText.textContent = "屏住呼吸，輕輕推開一條縫……";
                doorBox.classList.add("door-peek");
            } else {
                doorActionText.textContent = "氣勢十足地一把推開房門！！";
                doorBox.classList.add("door-slam", "animate-shake");
            }

            // 計算抽卡結果
            const outcome = rollOutcome(actionType, userName, charName);

            // 動畫播放 750ms 後揭示結果
            setTimeout(() => {
                doorBox.classList.add("hidden");
                displayOutcome(outcome);
                isAnimating = false;
            }, 750);
        }

        // 機率判定與文本生成引擎

                : "你一下子打開了門，";

            // 累積機率區間判斷：

            // 0.14 ~ 0.22 (8%): diy (正在 DIY)
            // 0.22 ~ 0.32 (10%): no_underwear (沒穿內褲)
            // 0.32 ~ 1.00 (68%): normal (正常穿著男士內褲)
            if (rand < 0.08) {
                eventType = "absent";
            } else if (rand < 0.14) {
                eventType = "wear_user";
            } else if (rand < 0.22) {
                eventType = "diy";
            } else if (rand < 0.32) {
                eventType = "no_underwear";
            } else {
                eventType = "normal";

            // 渲染劇情內容
            storyOutput.innerHTML = outcome.storyText;

            // 準備社群分享純文字文案
            const plainStory = storyOutput.innerText.replace(/\n+/g, "\n");
            const actionLabel = outcome.actionType === "peek" ? "稍稍偷看" : "直接打開門";
            lastShareText = `【夢女偷看夢角內褲模擬器 💕】\n${outcome.userName} 選擇了「${actionLabel}」${outcome.charName} 的房門——\n\n${plainStory}\n\n✨ 觸發事件：【${outcome.eventMeta.rarity}・${outcome.eventMeta.title}】`;

            card.classList.remove("hidden");

            // 更新圖鑑與歷史紀錄
            renderEncyclopedia();
            addHistoryItem(outcome);
        }

        // 愛心五彩紙屑特效
        function triggerHeartConfetti(isBig) {
            if (typeof confetti !== "function") return;
            confetti({
                particleCount: isBig ? 65 : 30,
                spread: isBig ? 80 : 55,
                origin: { y: 0.6 },
                colors: ['#F43F5E', '#EC4899', '#A855F7', '#FBBF24']
            });
        }

        // ==========================================
        // 6. 圖鑑與歷史紀錄 UI 更新
        // ==========================================
        function renderEncyclopedia() {
            const grid = document.getElementById("encyclopediaGrid");
            const counter = document.getElementById("collectionCounter");
            const progressBar = document.getElementById("collectionProgressBar");

            const unlockedCount = unlockedEvents.size;
            const totalCount = EVENT_CATALOG.length;
            const percent = Math.round((unlockedCount / totalCount) * 100);

            counter.textContent = `${unlockedCount} / ${totalCount} 已解鎖`;
            progressBar.style.width = `${percent}%`;

            grid.innerHTML = EVENT_CATALOG.map(item => {
                const isUnlocked = unlockedEvents.has(item.id);
                if (isUnlocked) {
                    return `
                        <div class="p-2.5 rounded-2xl bg-gradient-to-b from-rose-50 to-white border border-rose-200 text-center space-y-1 shadow-sm transition-transform hover:-translate-y-0.5" title="${item.desc}">
                            <div class="w-7 h-7 mx-auto rounded-full bg-rose-500 text-white flex items-center justify-center text-xs shadow-sm">
                                <i class="fa-solid ${item.icon}"></i>
                            </div>
                            <div class="text-[10px] font-black text-rose-500">${item.rarity}</div>
                            <div class="text-xs font-bold text-wineDark truncate">${item.title}</div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="p-2.5 rounded-2xl bg-slate-50/70 border border-dashed border-rose-200/70 text-center space-y-1 opacity-65" title="尚未解鎖此事件">
                            <div class="w-7 h-7 mx-auto rounded-full bg-rose-100 text-rose-300 flex items-center justify-center text-xs">
                                <i class="fa-solid fa-question"></i>
                            </div>
                            <div class="text-[10px] font-bold text-rose-300">${item.rarity}</div>
                            <div class="text-xs font-medium text-rose-300">？？？</div>
                        </div>
                    `;
                }
            }).join("");
        }

        function addHistoryItem(outcome) {
            drawHistory.unshift(outcome);
            if (drawHistory.length > 30) drawHistory.pop();
            renderHistoryList();
        }

        function renderHistoryList() {
            const listEl = document.getElementById("historyList");
            const countEl = document.getElementById("historyCount");
            countEl.textContent = drawHistory.length;

            if (drawHistory.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-6 text-xs text-rose-300 italic">
                        還沒有偷看紀錄喔，快去門縫邊試試手氣吧～
                    </div>
                `;
                return;
            }

            listEl.innerHTML = drawHistory.map(item => {
                const badgeStyle = item.eventMeta.rarity === "SSR"
                    ? "bg-rose-600 text-white"
                    : item.eventMeta.rarity === "SR"
                        ? "bg-orange-400 text-white"
                        : "bg-rose-100 text-rose-700";

                const actionIcon = item.actionType === "peek" ? "fa-eye" : "fa-door-open";

                return `
                    <div class="flex items-center justify-between gap-3 p-3 rounded-2xl bg-cream border border-rose-100 hover:border-rose-300 transition-colors text-xs">
                        <div class="flex items-center gap-2.5 min-w-0">
                            <span class="shrink-0 px-2 py-0.5 rounded-md font-black text-[10px] ${badgeStyle}">
                                ${item.eventMeta.rarity}
                            </span>
                            <div class="truncate">
                                <span class="font-bold text-wineDark">${escapeHtml(item.charName)}</span>
                                <span class="text-wineMid/70 mx-1">·</span>
                                <span class="text-rose-600 font-medium">${escapeHtml(item.summaryShort)}</span>
                            </div>
                        </div>
                        <div class="shrink-0 flex items-center gap-2 text-[11px] text-rose-400">
                            <i class="fa-solid ${actionIcon}" title="${item.actionType === 'peek' ? '稍稍偷看' : '直接打開門'}"></i>
                            <span>${item.timestamp}</span>
                        </div>
                    </div>
                `;
            }).join("");
        }

        function clearHistory() {
            drawHistory = [];
            renderHistoryList();
            showToast("已清空本次窺探紀錄");
        }

        // ==========================================
        // 7. 複製文案與輔助工具
        // ==========================================
        function copyResultText() {
            if (!lastShareText) return;

            // 使用兼容性最高的 textarea + execCommand('copy') 確保在 iframe 中也能順利複製
            const textArea = document.createElement("textarea");
            textArea.value = lastShareText;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.select();

            try {
                document.execCommand("copy");
                showToast("已複製小劇場文案！快去社群分享吧 💕");
            } catch (err) {
                showToast("複製失敗，請手動選取文字複製");
            } finally {
                document.body.removeChild(textArea);
            }
        }

        let toastTimer = null;
        function showToast(msg) {
            const toast = document.getElementById("toastNotification");
            const toastMsg = document.getElementById("toastMessage");
            toastMsg.textContent = msg;

            toast.classList.remove("opacity-0", "translate-y-4");
            toast.classList.add("opacity-100", "translate-y-0");

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove("opacity-100", "translate-y-0");
                toast.classList.add("opacity-0", "translate-y-4");
            }, 2500);
        }

        // 防止 XSS 跳脫字元
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function (m) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                }[m];
            });
        }

        // 背景微光愛心點綴生成
        function spawnBackgroundHearts() {
            const container = document.getElementById("floating-hearts-bg");
            const positions = [
                { top: "10%", left: "6%", size: "text-xl", delay: "0s" },
                { top: "24%", right: "8%", size: "text-2xl", delay: "1s" },
                { top: "55%", left: "4%", size: "text-lg", delay: "2s" },
                { top: "75%", right: "6%", size: "text-xl", delay: "0.5s" },
                { top: "88%", left: "12%", size: "text-2xl", delay: "1.5s" }
            ];

            positions.forEach(pos => {
                const heart = document.createElement("i");
                heart.className = `fa-solid fa-heart absolute text-rose-300/30 animate-float ${pos.size}`;
                if (pos.top) heart.style.top = pos.top;
                if (pos.left) heart.style.left = pos.left;
                if (pos.right) heart.style.right = pos.right;
                heart.style.animationDelay = pos.delay;
                container.appendChild(heart);
            });
        }
    </script>
</body>
</html>
